# Netlify reads this file from the repository root.
# Set VITE_SITE_URL (e.g. https://your-site.netlify.app/) in Site settings > Environment variables;
# build:release fails without it rather than shipping pages without social-preview URLs.
[build]
  base = "site"
  command = "npm ci && npm run build:release"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
