[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "as-audit"
version = "0.0.1"
description = "Auditable market microstructure research infrastructure"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<2.4", "polars", "pydantic>=2,<3", "structlog", "typer", "httpx[socks]", "websockets"]

[project.scripts]
asaudit = "asaudit.cli:app"

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/asaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
