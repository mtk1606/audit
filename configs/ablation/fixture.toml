# FIXTURE smoke configuration on synthetic L3 data. Outputs are labelled fixture
# output and are not market results. Small budgets keep it to a few minutes.
run_name = "ablation_fixture"
seed = 20260913
cancel_attribution = ["pessimistic", "uniform", "optimistic"]

[data]
source = "synthetic"
symbols = ["SYNA", "SYNB", "SYNC", "SYND", "SYNE"]
synthetic_duration_s = 1500.0
episode_s = 60.0
calibration = 0.4
policy_fit = 0.4
holdout = 0.2

[sim]
batch_ms = 100
latency_ns = 100000
max_inventory = 20
markout_horizon_ns = 1000000000

[strategies]
as_gamma_per_tick = 0.01
symmetric_half_spread_ticks = 0.5
policy_classes = ["linear_skew"]
reference_class = "linear_skew"
budget = 30
sigma0 = 0.5
delta0 = 0.5

[eval]
bootstrap_repeats = 2000
min_train = 3
allow_unconverged = true
