name: nightly
on:
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - run: uv run python scripts/fetch_lobster_sample.py
      - name: M0 gate on every sample symbol
        run: |
          for s in AAPL AMZN GOOG INTC MSFT; do
            uv run asaudit data validate --source lobster --symbol $s --date 2012-06-21
          done
      - run: uv run asaudit reproduce --paper --workers 4
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
