name: nightly
on:
  schedule: [{cron: "17 5 * * *"}]  # scheduled runs only fire on the default branch
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed by the pre-registration gate
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - name: Full reproduction on synthetic order flow
        run: uv run asaudit reproduce --paper --fixture --workers 4
      - run: uv run python scripts/fetch_lobster_sample.py
      - name: Market-data validation on every sample symbol
        run: |
          for s in AAPL AMZN GOOG INTC MSFT; do
            uv run asaudit data validate --source lobster --symbol $s --date 2012-06-21 --config configs/data/lobster.toml
          done
      # Market attribution is never computed before the pre-registration is
      # committed and tagged. The code enforces this too (require_preregistration).
      - name: Full reproduction on market data
        if: hashFiles('PREREGISTRATION.md') != ''
        run: uv run asaudit reproduce --paper --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
